name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: testing
      APP_SECRET_KEY: test-only-secret-not-for-production
      ENCRYPTION_MASTER_KEY: 3YjGpFKh7GGqeXaNfK57FDY3D_FdI7_ZJbRve6awqPg=
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_platform_test
      REDIS_URL: redis://localhost:6379/0
      TELEGRAM_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/pyproject.toml ]; then
            pip install -e "./apps/api[bot,worker,dev]" -e ./apps/bot -e ./apps/worker
          elif [ -f requirements.txt ]; then pip install -r requirements.txt
          else pip install -e ".[dev]"
          fi
      - name: Lint
        run: ruff check --config apps/api/pyproject.toml apps
      - name: Type check
        run: mypy --config-file apps/api/pyproject.toml apps/api/src apps/worker/src packages/python
      - name: Validate migrations
        run: cd apps/api && alembic upgrade head && alembic check
      - name: Test
        run: >-
          pytest -c apps/api/pyproject.toml apps/api/tests apps/bot/tests apps/worker/tests
          --cov=platform_api --cov=platform_worker
          --cov-report=term-missing --cov-report=xml --cov-fail-under=50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          if [ -f apps/api/pyproject.toml ]; then
            python -m pip install -e "./apps/api[bot,worker]"
            pip-audit --local
          elif [ -f requirements.txt ]; then pip-audit -r requirements.txt
          else pip-audit .
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: false
          load: true
          tags: ai-agent-platform-api:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          load: true
          tags: ai-agent-platform-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-agent-platform-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-agent-platform-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
