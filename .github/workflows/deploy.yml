name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')) &&
      vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy immutable main revision over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_SHA,APP_PATH
          script_stop: true
          script: |
            set -eu
            cd "$APP_PATH"
            git fetch --prune origin main
            git checkout --detach "$DEPLOY_SHA"
            docker compose up --detach --build --remove-orphans
            docker compose exec -T nginx wget --quiet --tries=5 --spider http://localhost/healthz
            docker image prune --force --filter "until=168h"

