[project]
name = "ai-agent-platform-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.17,<4",
  "aiohttp-socks>=0.10,<1",
  "arq>=0.26,<1",
  "fastapi>=0.115,<1",
  "redis>=5.2,<7",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_bot"]
