[project]
name = "ai-agent-platform-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.7,<3",
  "yt-dlp>=2025.1.26",
  "aiogram>=3.17,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_worker"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]
