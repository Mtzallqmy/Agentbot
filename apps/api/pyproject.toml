[project]
name = "ai-agent-platform-api"
version = "0.1.0"
description = "Production-oriented modular backend for the Arabic AI agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "cryptography>=44,<47",
  "redis>=5.2,<7",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.20,<1",
  "structlog>=24.4,<26",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
bot = ["aiogram>=3.17,<4"]
worker = ["arq>=0.26,<1", "yt-dlp>=2025.1.26", "boto3>=1.36,<2"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"apps/worker/src/platform_worker/main.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
